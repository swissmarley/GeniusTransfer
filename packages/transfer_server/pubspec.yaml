name: transfer_server
description: >-
  Local plain-HTTP server for GeniusTransfer. Serves shared files and a
  self-contained guest page to a browser on the same network. Pure Dart
  (dart:io), no Flutter imports, so it can be tested with `dart test`.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  ffi: ^2.2.0
  mime: ^2.1.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
